<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Tháp Khối — máy soát phần chơi</title>
<!--
    MÁY SOÁT PHẦN CHƠI
    ------------------------------------------------------------------------
    Mở:  http://localhost:4173/block-tower/check-play.html

    check-rules.js soát LUẬT bằng Node. Máy này soát PHẦN CHƠI THẬT: nạp đúng
    index.html của game qua khung nhúng, rồi cho một con rô-bốt ngồi chơi bằng
    CHÍNH những hàm mà ngón tay bé gọi — tryMove, tryRotate, hardDrop.

    Vì sao phải có cả hai: luật đúng mà phần chơi gọi sai thì bé vẫn gặp lỗi.
    Bài học từ Cỗ Máy Kỳ Quặc — máy soát chạy luật thì màn nào cũng qua, nhưng
    kéo bằng tay thật lại không phá nổi màn 3, vì chỗ hỏng nằm ở phần chạm.

    Các phép soát:
      1. Rô-bốt chơi trọn ván bằng hàm thật — ăn được hàng, lên được bàn
      2. Không bao giờ có quân nào nằm đè lên khối cũ (soát từng nhịp)
      3. Ăn hàng xong không sót ô lơ lửng
      4. Cú thả nhanh luôn dừng đúng ô thấp nhất còn đặt được
      5. Ân huệ khi chạm đáy: xoay được sau khi đã chạm, và không kéo dài vô hạn
      6. Đủ ảnh khối cho cả năm màu, nướng ở gấp ba, và năm màu phân biệt được
      7. Điểm và số hàng trên bảng khớp với trạng thái thật
      7a. Tiếng chạm đáy phát ĐÚNG nhịp khối chạm, không đợi tới lúc gắn
      8. Bảng điểm không tràn ra ngoài trên màn điện thoại hẹp 390px
-->
<style>
    body { font-family: ui-monospace, Menlo, monospace; background: #0b1220; color: #e2e8f0;
           margin: 0; padding: 20px; font-size: 13px; line-height: 1.65; }
    h1 { font-size: 16px; color: #ffc93c; margin: 0 0 4px; }
    .sub { color: #94a3b8; margin-bottom: 16px; }
    #out { white-space: pre-wrap; }
    .ok { color: #8ce99a; } .bad { color: #ff8fae; } .dim { color: #64748b; }
    iframe { position: fixed; left: -3000px; width: 1100px; height: 900px; border: 0; }
</style>
</head>
<body>
<h1>THÁP KHỐI — máy soát phần chơi</h1>
<div class="sub">rô-bốt chơi bằng chính mã của game, không phải bản chép lại</div>
<div id="out">đang nạp game…</div>
<iframe id="frame" src="/block-tower/"></iframe>

<script>
'use strict';

var out = document.getElementById('out');
var fails = [];
function say(s, cls) { out.innerHTML += '<span class="' + (cls || '') + '">' + s + '</span>\n'; }
function fail(s) { fails.push(s); }

function ready(win, cb) {
    var tries = 0;
    (function poll() {
        if (win.blockTower && win.blockTower.UI && win.blockTower.UI.scene) return cb();
        if (++tries > 200) { say('KHÔNG NẠP ĐƯỢC GAME', 'bad'); return; }
        setTimeout(poll, 50);
    })();
}

/* Rô-bốt: chọn chỗ đặt tốt nhất rồi ĐI TỚI ĐÓ bằng đúng những hàm ngón tay bé
 * gọi — tryMove để đẩy ngang, tryRotate để xoay, hardDrop để thả. Không được
 * đặt thẳng toạ độ vào quân: làm thế thì máy soát bỏ qua hết phần điều khiển,
 * mà điều khiển mới là chỗ hay hỏng. */
function robotPlay(win, R, G, sc, opt) {
    opt = opt || {};
    var steps = 0, guard = opt.guard || 60 * 60 * 6;
    var placed = 0, badOverlap = 0, badGhost = 0, floaters = 0;

    function overlapCheck() {
        if (!G.piece) return;
        var c = R.cellsOf(G.piece);
        for (var i = 0; i < c.length; i++) {
            var x = c[i][0], y = c[i][1];
            if (y < 0) continue;
            if (x < 0 || x >= R.COLS || y >= R.ROWS) { badOverlap++; return; }
            if (G.board[y][x]) { badOverlap++; return; }
        }
    }

    /* Cú thả nhanh phải dừng đúng ô thấp nhất còn đặt được. Trước đây phép
     * soát này mang tên "đường bóng" vì cùng hàm dropTo() còn lo cái khung mờ
     * báo trước; anh Hiếu bảo bỏ khung ấy, nhưng hàm thì vẫn phải đúng. */
    function landCheck() {
        if (!G.piece) return;
        var gh = R.dropTo(G.board, G.piece);
        if (!R.fits(G.board, gh)) { badGhost++; return; }
        if (R.fits(G.board, R.moved(gh, 0, 1))) badGhost++;
    }

    /* ô trống bị khối nhốt bên trên — đếm để biết ăn hàng có sót gì không */
    function floatCheck(before) {
        var h = R.holes(G.board);
        if (h > before + 4) floaters++;
        return h;
    }

    var lastPiece = null, target = null, holesBefore = 0;

    while (G.mode !== 'over' && steps++ < guard) {
        if (G.mode === 'play' && G.piece) {
            overlapCheck();
            landCheck();

            /* quân mới thì tính lại chỗ muốn đặt */
            if (G.piece !== lastPiece && !target) {
                target = bestPlacement(R, G.board, G.piece);
                lastPiece = G.piece;
                holesBefore = R.holes(G.board);
            }

            if (target) {
                if ((G.piece.rot & 3) !== target.rot) {
                    if (!sc.tryRotate(1)) target = null;      // không xoay được thì thả đại
                } else if (G.piece.x < target.x) {
                    if (!sc.tryMove(1)) target = null;
                } else if (G.piece.x > target.x) {
                    if (!sc.tryMove(-1)) target = null;
                } else {
                    sc.hardDrop();
                    placed++;
                    target = null;
                    lastPiece = null;
                    floatCheck(holesBefore);
                }
            } else {
                sc.hardDrop();
                placed++;
                lastPiece = null;
                floatCheck(holesBefore);
            }
        }
        sc.stepAll(1 / 60);
        if (opt.max && placed >= opt.max) break;
    }
    return { steps: steps, placed: placed, badOverlap: badOverlap, badGhost: badGhost, floaters: floaters };
}

function bestPlacement(R, board, piece) {
    var best = null, bestScore = -1e9;
    for (var rot = 0; rot < 4; rot++) {
        for (var x = -2; x < R.COLS + 2; x++) {
            var p = { type: piece.type, mat: piece.mat, x: x, y: piece.y, rot: rot };
            if (!R.fits(board, p)) continue;
            var land = R.dropTo(board, p);
            var copy = board.map(function (r) { return r.slice(); });
            var over = R.lock(copy, land);
            if (over) continue;
            var rows = R.fullRows(copy);
            var sc2 = rows.length * 60 - R.holes(copy) * 12 - R.stackHeight(copy) * 2;
            if (sc2 > bestScore) { bestScore = sc2; best = { x: x, rot: rot }; }
        }
    }
    return best;
}

window.addEventListener('load', function () {
    var win = document.getElementById('frame').contentWindow;
    ready(win, function () { setTimeout(function () { run(win); }, 300); });
});

function run(win) {
    out.innerHTML = '';
    var R = win.TowerRules, G = win.blockTower.G, sc = win.blockTower.UI.scene;

    /* ---- 1–3: rô-bốt chơi bằng hàm thật ---- */
    say('· rô-bốt chơi bằng chính hàm mà ngón tay bé gọi', 'dim');
    var totalPlaced = 0, totalLines = 0, maxLevel = 1;
    for (var g = 0; g < 6; g++) {
        win.blockTower.UI.start();
        sc.frozen = true;
        sc.startGame(3000 + g * 97);
        var r = robotPlay(win, R, G, sc, { max: 160 });
        totalPlaced += r.placed;
        totalLines += G.lines;
        if (G.level > maxLevel) maxLevel = G.level;
        say('    ván ' + (g + 1) + ': đặt ' + r.placed + ' quân · ăn ' + G.lines +
            ' hàng · bàn ' + G.level + ' · ' + G.score + ' điểm' +
            (r.badOverlap ? ' · ĐÈ NHAU ' + r.badOverlap : '') +
            (r.badGhost ? ' · THẢ SAI Ô ' + r.badGhost : '') +
            (r.floaters ? ' · Ô LƠ LỬNG ' + r.floaters : ''),
            (r.badOverlap || r.badGhost || r.floaters) ? 'bad' : '');
        if (r.badOverlap) fail('ván ' + (g + 1) + ': quân đang rơi nằm đè lên khối cũ ' + r.badOverlap + ' nhịp');
        if (r.badGhost) fail('ván ' + (g + 1) + ': cú thả nhanh dừng sai ô ' + r.badGhost + ' nhịp');
        if (r.floaters) fail('ván ' + (g + 1) + ': ăn hàng xong sinh ra ô lơ lửng ' + r.floaters + ' lần');
        if (r.placed < 40) fail('ván ' + (g + 1) + ': rô-bốt chỉ đặt nổi ' + r.placed + ' quân — điều khiển đang kẹt ở đâu đó');
    }
    say('    cộng lại: ' + totalPlaced + ' quân, ' + totalLines + ' hàng, cao nhất bàn ' + maxLevel);
    if (!totalLines) fail('chơi sáu ván mà không ăn nổi một hàng nào');

    /* ---- 5: ân huệ khi chạm đáy ---- */
    say('');
    say('· ân huệ khi quân đã chạm đáy', 'dim');
    win.blockTower.UI.start();
    sc.frozen = true;
    sc.startGame(555);
    /* thả quân xuống sát đáy rồi bước tới lúc nó chạm */
    var guard = 0;
    while (guard++ < 6000 && R.fits(G.board, R.moved(G.piece, 0, 1))) sc.stepAll(1 / 60);
    var landed = !R.fits(G.board, R.moved(G.piece, 0, 1));
    /* chạm rồi vẫn phải xoay được */
    var rotOk = sc.tryRotate(1);
    /* và ân huệ phải HẾT chứ không kéo dài vô hạn — bước một giây rưỡi */
    var before = JSON.stringify(G.board);
    for (var t = 0; t < 120; t++) sc.stepAll(1 / 60);
    var lockedEventually = JSON.stringify(G.board) !== before;
    say('    quân chạm đáy: ' + (landed ? 'có' : 'KHÔNG') +
        ' · xoay được sau khi chạm: ' + (rotOk ? 'có' : 'không') +
        ' · sau 2 giây đã gắn vào giếng: ' + (lockedEventually ? 'có' : 'CHƯA'),
        (landed && lockedEventually) ? 'ok' : 'bad');
    if (!landed) fail('không dựng được tình huống quân chạm đáy để thử');
    if (!lockedEventually) fail('quân chạm đáy rồi mà hai giây sau vẫn chưa gắn vào giếng — ân huệ đang kéo dài vô hạn');

    /* ---- 6: ảnh khối ---- */
    say('');
    say('· ảnh khối nướng sẵn', 'dim');
    var CELL = win.blockTower.size().CELL;
    var miss = [], small = [];
    /* Một ảnh cho mỗi màu. Hồi làm khối lập phương phải nướng tám biến thể theo
     * hàng xóm; khối phẳng thì không mặt nào bị che nên bỏ được cả tầng ấy. */
    Object.keys(win.TowerArt.MATS).forEach(function (k) {
        var key = 'cube_' + k + '_' + CELL;
        if (!sc.textures.exists(key)) { miss.push(k); return; }
        var src = sc.textures.get(key).getSourceImage();
        /* Nướng đúng cỡ hiển thị thì lên màn nét đôi là nhoè — bài học từ Máy
         * Gắp Thú. Ảnh phải rộng hơn ô ít nhất gấp đôi. */
        if (src.width < CELL * 2) small.push(k + ' rộng ' + src.width + 'px cho ô ' + CELL + 'px');
    });
    var wantTex = Object.keys(win.TowerArt.MATS).length;
    say('    ' + (wantTex - miss.length) + '/' + wantTex + ' ảnh khối, ô ' + CELL + 'px, ảnh ' +
        (sc.textures.exists('cube_gold_' + CELL) ? sc.textures.get('cube_gold_' + CELL).getSourceImage().width + 'px' : '—'));
    if (miss.length) fail('thiếu ảnh khối: ' + miss.join(', '));
    if (small.length) fail('ảnh nướng nhỏ quá, lên màn nét đôi sẽ nhoè: ' + small.join(', '));

    /* ---- 7: bảng điểm khớp trạng thái thật ---- */
    say('');
    say('· bảng điểm có khớp trạng thái thật không', 'dim');
    win.blockTower.UI.start();
    sc.frozen = true;
    sc.startGame(881);
    robotPlay(win, R, G, sc, { max: 40 });
    win.blockTower.UI.paintHud();
    var d = win.document;
    var shown = {
        score: +d.getElementById('hud-score').textContent,
        lines: +d.getElementById('hud-lines').textContent,
        level: +d.getElementById('hud-level').textContent
    };
    say('    bảng ghi ' + shown.score + ' điểm / ' + shown.lines + ' hàng / bàn ' + shown.level +
        ' — thật là ' + G.score + ' / ' + G.lines + ' / ' + G.level,
        (shown.score === G.score && shown.lines === G.lines && shown.level === G.level) ? 'ok' : 'bad');
    if (shown.score !== G.score) fail('bảng ghi ' + shown.score + ' điểm mà thật ra là ' + G.score);
    if (shown.lines !== G.lines) fail('bảng ghi ' + shown.lines + ' hàng mà thật ra là ' + G.lines);
    if (shown.level !== G.level) fail('bảng ghi bàn ' + shown.level + ' mà thật ra là bàn ' + G.level);

    /* ---- 7a: TIẾNG CHẠM ĐÁY PHẢI ĐÚNG LÚC KHỐI CHẠM ĐÁY ----
     *
     * Anh Hiếu nghe ra: "khối hình đã rơi xuống đáy rồi nhưng một lúc sau mới
     * nghe thấy âm thanh". Đúng: em chỉ có một tiếng và đặt nó ở chỗ quân GẮN
     * vào giếng, mà giữa lúc chạm với lúc gắn còn 0,45 giây ân huệ cho bé xoay
     * nốt. Mắt thấy khối nằm im rồi, nửa giây sau tai mới nghe.
     *
     * Máy này đếm bằng NHỊP MÁY chứ không bằng tai: bước tới lúc quân vừa hết
     * chỗ rơi, rồi xem tiếng "chạm" có được ghi ngay nhịp ấy không, và tiếng
     * "gắn" có tới muộn hơn không. Hai tiếng, hai thời điểm, mỗi tiếng đúng
     * việc của nó.
     */
    say('');
    say('· tiếng chạm đáy có đúng lúc không', 'dim');
    win.blockTower.UI.start();
    sc.frozen = true;
    sc.startGame(2024);
    var S2 = win.blockTower.sfx;
    S2.trace = true; S2.log = [];

    var stepsToRest = 0, restedAt = -1, touchAt = -1, lockAt = -1;
    for (var st = 0; st < 60 * 30; st++) {
        var wasResting = !R.fits(G.board, R.moved(G.piece, 0, 1));
        var before = S2.log.length;
        sc.stepAll(1 / 60);
        for (var q4 = before; q4 < S2.log.length; q4++) {
            if (S2.log[q4].name === 'touch' && touchAt < 0) touchAt = st;
            if (S2.log[q4].name === 'lock' && lockAt < 0) lockAt = st;
        }
        if (wasResting && restedAt < 0) restedAt = st;
        if (lockAt >= 0) break;
    }
    var gapTouch = (touchAt - restedAt) / 60, gapLock = (lockAt - restedAt) / 60;
    say('    quân hết chỗ rơi ở nhịp ' + restedAt +
        ' · tiếng chạm ở nhịp ' + touchAt + ' (' + gapTouch.toFixed(2) + 's sau)' +
        ' · tiếng gắn ở nhịp ' + lockAt + ' (' + gapLock.toFixed(2) + 's sau)',
        (touchAt >= 0 && Math.abs(gapTouch) < 0.05 && lockAt > touchAt) ? 'ok' : 'bad');
    if (touchAt < 0) fail('không có tiếng nào lúc quân chạm đáy');
    if (Math.abs(gapTouch) > 0.05)
        fail('tiếng chạm đáy trễ ' + gapTouch.toFixed(2) + ' giây so với lúc khối thật sự chạm — tai và mắt lệch nhau');
    if (lockAt <= touchAt) fail('tiếng gắn phải tới SAU tiếng chạm, không phải cùng lúc');

    /* Mọi tiếng "phản hồi tức thì" phải phát ngay, không được hẹn giờ. */
    S2.log = [];
    sc.tryMove(1); sc.tryRotate(1);
    var immediate = S2.log.map(function (e) { return e.name; }).join(' ');
    say('    bấm một cái là nghe ngay: ' + (immediate || 'KHÔNG CÓ TIẾNG NÀO'),
        (immediate.indexOf('move') >= 0 && immediate.indexOf('turn') >= 0) ? 'ok' : 'bad');
    if (immediate.indexOf('move') < 0) fail('đẩy ngang không có tiếng');
    if (immediate.indexOf('turn') < 0) fail('xoay không có tiếng');
    S2.trace = false;

    /* ---- 7a1: NÉT LƯỚI PHẢI RƠI ĐÚNG RANH GIỚI Ô ----
     *
     * Anh Hiếu bảo vẽ lưới ô vuông, bỏ hốc bo góc. Vẽ được lưới thì dễ; khó là
     * nó có KHỚP không — lệch nửa ô là khối đáp xuống nằm chồm lên nét kẻ, nhìn
     * lệch mà không nói được lệch ở đâu.
     *
     * Máy này ĐỌC ĐIỂM ẢNH của chính tấm lưới đã nướng: quét một hàng ngang,
     * tìm các cột sáng, rồi xem khoảng cách giữa chúng có đúng bằng cạnh ô
     * không. Đo trên hình chứ không đọc mã, nên có sửa cách vẽ kiểu gì cũng
     * không lừa được nó.
     */
    say('');
    say('· nét lưới có rơi đúng ranh giới ô không', 'dim');
    var CELL2 = win.blockTower.size().CELL;
    var TS = win.TowerArt.TEX_SCALE;
    var gk = 'well_grid_' + CELL2;
    var hasGrid = sc.textures.exists(gk);
    if (!hasGrid) {
        say('    KHÔNG CÓ ảnh lưới', 'bad');
        fail('không có ảnh lưới nền');
    } else {
        var img = sc.textures.get(gk).getSourceImage();
        var cvg = win.document.createElement('canvas');
        cvg.width = img.width; cvg.height = img.height;
        cvg.getContext('2d').drawImage(img, 0, 0);
        /* Lấy mẫu ở GIỮA một hàng ô, không lấy ở chính giữa ảnh.
         *
         * Lần đầu em lấy hàng giữa ảnh — mà giữa ảnh đúng là một nét kẻ NGANG,
         * nên cả hàng sáng đều và máy đếm được đúng một "nét dọc" chạy suốt.
         * Lại là cái thước sai chứ không phải cái lưới. */
        var sampleY = Math.round((4 + 0.5) * CELL2 * TS);
        var px = cvg.getContext('2d').getImageData(0, sampleY, img.width, 1).data;

        /* Cột nào có nét. Ngưỡng lấy THEO chính hàng ảnh này chứ không gõ tay
         * một con số: nét lưới cố ý rất mờ (alpha ~0,085 nên chỉ chừng 22/255),
         * và lần đầu em gõ ngưỡng 40 thì máy đếm được 0 nét rồi báo hỏng oan —
         * lưới thì đúng, cái thước mới sai. */
        var peak = 0;
        for (var xp = 0; xp < img.width; xp++) peak = Math.max(peak, px[xp * 4 + 3]);
        var thr = Math.max(4, peak * 0.5);
        var cols2 = [], run = -1;
        for (var x3 = 0; x3 < img.width; x3++) {
            var on2 = px[x3 * 4 + 3] >= thr;
            if (on2 && run < 0) run = x3;
            if ((!on2 || x3 === img.width - 1) && run >= 0) { cols2.push((run + x3 - 1) / 2); run = -1; }
        }
        var gaps = [];
        for (var i3 = 1; i3 < cols2.length; i3++) gaps.push(cols2[i3] - cols2[i3 - 1]);
        var want = CELL2 * TS;
        var worst = 0;
        for (var i4 = 0; i4 < gaps.length; i4++) worst = Math.max(worst, Math.abs(gaps[i4] - want));

        say('    ảnh lưới ' + img.width + '×' + img.height + ' (cần ' +
            (CELL2 * R.COLS * TS) + '×' + (CELL2 * R.ROWS * TS) + ')');
        say('    đỉnh alpha ' + peak + ', ngưỡng ' + thr.toFixed(0));
        say('    tìm được ' + cols2.length + ' nét dọc, khoảng cách ' +
            (gaps.length ? gaps[0].toFixed(1) : '—') + 'px, cạnh ô là ' + want +
            'px, lệch nhiều nhất ' + worst.toFixed(1) + 'px',
            (cols2.length === R.COLS - 1 && worst < 2) ? 'ok' : 'bad');

        if (img.width !== CELL2 * R.COLS * TS || img.height !== CELL2 * R.ROWS * TS)
            fail('ảnh lưới không đúng khổ cái giếng — lưới sẽ lệch khỏi ô khối');
        if (cols2.length !== R.COLS - 1)
            fail('đếm được ' + cols2.length + ' nét dọc, đáng lẽ ' + (R.COLS - 1) + ' (mười cột thì chín vạch ngăn)');
        if (worst >= 2)
            fail('khoảng cách giữa các nét lệch tới ' + worst.toFixed(1) + 'px so với cạnh ô — khối sẽ nằm chồm lên nét kẻ');
    }

    /* ---- 7a1b: CHÚ MÈO VÀ CÁI ĐỒNG HỒ ----
     *
     * Anh Hiếu: "trang trí thêm 1 chú mèo ở ghế sofa thỉnh thoảng vẫy đuôi,
     * liếm lông... ở góc phải treo đồng hồ thể hiện thời gian thực".
     *
     * Đồng hồ dễ làm sai một cách lặng lẽ: đảo kim giờ với kim phút, hay quên
     * cho kim giờ nhích theo phút, thì nhìn vẫn ra cái đồng hồ nhưng chỉ sai
     * giờ. Nên máy hỏi thẳng bằng số ở mấy mốc dễ kiểm.
     */
    say('');
    say('· chú mèo và cái đồng hồ', 'dim');
    var CH = win.TowerArt.clockHands;
    var D = function (h, m, s2) { return new Date(2026, 0, 1, h, m, s2 || 0); };
    var deg = function (rad) { var d2 = (rad * 180 / Math.PI + 90 + 360) % 360; return d2; };
    var cases = [
        { t: D(12, 0, 0), h: 0, m: 0, s: 0, vi: '12:00' },
        { t: D(3, 0, 0), h: 90, m: 0, s: 0, vi: '3:00' },
        { t: D(6, 30, 15), h: 195, m: 180, s: 90, vi: '6:30:15' },
        { t: D(23, 15, 45), h: 337.5, m: 90, s: 270, vi: '23:15:45' }
    ];
    var badClock = [];
    cases.forEach(function (c) {
        var a3 = CH(c.t);
        if (Math.abs(deg(a3.h) - c.h) > 0.6) badClock.push(c.vi + ': kim giờ ' + deg(a3.h).toFixed(1) + '° đáng lẽ ' + c.h + '°');
        if (Math.abs(deg(a3.m) - c.m) > 0.6) badClock.push(c.vi + ': kim phút ' + deg(a3.m).toFixed(1) + '° đáng lẽ ' + c.m + '°');
        if (Math.abs(deg(a3.s) - c.s) > 0.6) badClock.push(c.vi + ': kim giây ' + deg(a3.s).toFixed(1) + '° đáng lẽ ' + c.s + '°');
    });
    /* kim giờ phải NHÍCH theo phút, không đứng im cả tiếng rồi nhảy cóc */
    var creep = deg(CH(D(4, 30, 0)).h) - deg(CH(D(4, 0, 0)).h);
    say('    đồng hồ: ' + (badClock.length ? badClock.join(' · ') : 'bốn mốc giờ đều đúng') +
        ' · nửa tiếng kim giờ nhích ' + creep.toFixed(1) + '°',
        (!badClock.length && Math.abs(creep - 15) < 0.6) ? 'ok' : 'bad');
    badClock.forEach(function (b2) { fail('đồng hồ ' + b2); });
    if (Math.abs(creep - 15) > 0.6)
        fail('nửa tiếng mà kim giờ nhích ' + creep.toFixed(1) + '°, đáng lẽ 15° — kim giờ đang nhảy cóc từng giờ');

    /* mèo: phải có lúc nằm im, có lúc liếm lông, và tự quay vòng */
    win.blockTower.UI.start();
    sc.frozen = true;
    sc.startGame(31);
    var sawIdle = false, sawLick = false, licks = 0, wasLick = false;
    for (var s4 = 0; s4 < 60 * 60; s4++) {
        sc.stepAll(1 / 60);
        if (sc.catLick > 0.05) { sawLick = true; if (!wasLick) licks++; wasLick = true; }
        else { sawIdle = true; wasLick = false; }
    }
    say('    mèo trong 60 giây: ' + (sawIdle ? 'có lúc nằm im' : 'KHÔNG BAO GIỜ nằm im') +
        ', liếm lông ' + licks + ' lần',
        (sawIdle && licks >= 2) ? 'ok' : 'bad');
    if (!sawIdle) fail('con mèo liếm lông liên tục không nghỉ');
    if (licks < 2) fail('trong 60 giây con mèo chỉ liếm lông ' + licks + ' lần — quá thưa, bé không kịp thấy');

    /* ---- 7a2: NHẠC NỀN VÀ TIẾNG TÍCH ----
     *
     * Anh Hiếu: "game khi chơi buồn tẻ quá, các game kiểu này có nhạc nền vui
     * tươi khi chơi mà sao em không có, các khối gạch tự trôi cũng đều có các
     * âm thanh tick tick đi kèm cơ mà".
     *
     * Ba chuyện phải đúng và máy đếm được cả ba: nhạc chạy khi vào ván và
     * ngừng khi hết ván hay khi tạm dừng; nhịp nhạc nhanh dần theo bàn; và mỗi
     * lần khối tự trôi xuống một hàng thì có đúng một tiếng tích.
     */
    say('');
    say('· nhạc nền và tiếng tích', 'dim');
    var M = win.blockTower.music;
    win.blockTower.UI.start();
    sc.frozen = true;
    sc.startGame(1717);
    var mOnPlay = M.playing, bpm1 = M.bpm;
    win.blockTower.UI.togglePause();
    var mOnPause = M.playing;
    win.blockTower.UI.togglePause();
    var mBack = M.playing;
    M.setLevel(9);
    var bpm9 = M.bpm;
    M.setLevel(40);
    var bpmMax = M.bpm;
    say('    vào ván: ' + (mOnPlay ? 'có nhạc' : 'KHÔNG CÓ') +
        ' · tạm dừng: ' + (mOnPause ? 'VẪN CHẠY' : 'ngừng') +
        ' · chơi tiếp: ' + (mBack ? 'chạy lại' : 'KHÔNG CHẠY LẠI'),
        (mOnPlay && !mOnPause && mBack) ? 'ok' : 'bad');
    say('    nhịp nhạc: bàn 1 = ' + bpm1 + ' · bàn 9 = ' + bpm9 + ' · bàn 40 = ' + bpmMax + ' (có trần)',
        (bpm9 > bpm1 && bpmMax <= 170) ? 'ok' : 'bad');
    if (!mOnPlay) fail('vào ván mà không có nhạc nền');
    if (mOnPause) fail('tạm dừng rồi mà nhạc vẫn chạy');
    if (!mBack) fail('chơi tiếp mà nhạc không chạy lại');
    if (bpm9 <= bpm1) fail('lên bàn cao mà nhịp nhạc không nhanh lên');
    if (bpmMax > 170) fail('nhịp nhạc không có trần, bàn cao sẽ thành tiếng ù');
    /* Bảng giai điệu phải đủ tám ô nhịp và không được toàn nốt lặng */
    var notes = M.MELODY.filter(function (n) { return n > 0; }).length;
    say('    giai điệu: ' + M.MELODY.length + ' nốt móc đơn (' + (M.MELODY.length / 8) +
        ' ô nhịp), ' + notes + ' nốt có tiếng, ' + M.BASS.length + ' nốt trầm');
    if (M.MELODY.length < 32) fail('giai điệu quá ngắn, nghe vài vòng là chán');
    if (notes < M.MELODY.length * 0.5) fail('quá nửa giai điệu là nốt lặng');
    if (M.BASS.length !== M.MELODY.length / 8) fail('số nốt trầm không khớp số ô nhịp');

    /* tiếng tích: mỗi hàng tự trôi đúng một tiếng */
    win.blockTower.UI.start();
    sc.frozen = true;
    sc.startGame(1818);
    var S3 = win.blockTower.sfx;
    S3.trace = true; S3.log = [];
    var rowsFallen = 0, lastY = G.piece.y, ticks = 0;
    for (var s3 = 0; s3 < 60 * 12; s3++) {
        var before3 = S3.log.length;
        sc.stepAll(1 / 60);
        if (!G.piece) break;
        if (G.piece.y > lastY) { rowsFallen += G.piece.y - lastY; lastY = G.piece.y; }
        for (var q5 = before3; q5 < S3.log.length; q5++) if (S3.log[q5].name === 'tick') ticks++;
        if (rowsFallen >= 6) break;
    }
    S3.trace = false;
    say('    khối tự trôi ' + rowsFallen + ' hàng, nghe ' + ticks + ' tiếng tích',
        (rowsFallen > 0 && ticks === rowsFallen) ? 'ok' : 'bad');
    if (!rowsFallen) fail('không dựng được tình huống khối tự trôi để thử');
    if (ticks !== rowsFallen)
        fail('khối trôi ' + rowsFallen + ' hàng mà chỉ có ' + ticks + ' tiếng tích — nhịp tích là đồng hồ của ván chơi, thiếu là bé mất cảm giác nhịp');

    /* ---- 7b: NĂM MÀU KHỐI PHẢI KHÁC NHAU RÕ ----
     *
     * Phép soát cũ ở chỗ này hỏi "bốn ô liền có ra một khối liền không", hợp
     * với hồi khối còn là hình lập phương 2.5D. Anh Hiếu bảo làm lại thành khối
     * PHẲNG màu bắt mắt, nên câu hỏi cũng phải đổi: khối phẳng CỐ Ý có khe hở
     * giữa các ô, hỏi câu cũ là hỏi sai.
     *
     * Câu đúng bây giờ: năm màu có thật sự phân biệt được không, kể cả với bé
     * mù màu. Đo hai thứ trên chính ảnh đã nướng: khoảng cách màu giữa từng cặp,
     * và chênh lệch ĐỘ SÁNG — vì đỏ với xanh lá nhìn qua mắt mù màu đỏ-lục là
     * một, chỉ còn độ sáng để tách chúng ra.
     */
    say('');
    say('· năm màu khối có phân biệt được không', 'dim');
    var keys = Object.keys(win.TowerArt.MATS);
    var lums = {}, rgbs = {};
    keys.forEach(function (k) {
        var m = win.TowerArt.MATS[k].fill;
        var r2 = (m >> 16) & 255, g2 = (m >> 8) & 255, b2 = m & 255;
        rgbs[k] = [r2, g2, b2];
        lums[k] = 0.299 * r2 + 0.587 * g2 + 0.114 * b2;
    });
    var worstCol = 999, worstColPair = '', worstLum = 999, worstLumPair = '';
    for (var a1 = 0; a1 < keys.length; a1++) {
        for (var b1 = a1 + 1; b1 < keys.length; b1++) {
            var A1 = rgbs[keys[a1]], B1 = rgbs[keys[b1]];
            var dist = Math.sqrt(Math.pow(A1[0] - B1[0], 2) + Math.pow(A1[1] - B1[1], 2) + Math.pow(A1[2] - B1[2], 2));
            if (dist < worstCol) { worstCol = dist; worstColPair = keys[a1] + '/' + keys[b1]; }
            var dl = Math.abs(lums[keys[a1]] - lums[keys[b1]]);
            if (dl < worstLum) { worstLum = dl; worstLumPair = keys[a1] + '/' + keys[b1]; }
        }
    }
    say('    hai màu gần nhau nhất: ' + worstColPair + ' cách ' + worstCol.toFixed(0) +
        ' · hai màu sáng gần nhau nhất: ' + worstLumPair + ' chênh ' + worstLum.toFixed(0),
        (worstCol > 90 && worstLum > 18) ? 'ok' : 'bad');
    if (worstCol < 90) fail('hai màu ' + worstColPair + ' chỉ cách nhau ' + worstCol.toFixed(0) + ' — quá giống nhau');
    if (worstLum < 18) fail('hai màu ' + worstLumPair + ' chênh độ sáng chỉ ' + worstLum.toFixed(0) +
        ' — bé mù màu sẽ không tách được');

    narrowCheck();

    function narrowCheck() {
    /* ---- 8: màn điện thoại hẹp ---- */
    var frame = document.getElementById('frame');
    frame.style.width = '390px';
    frame.style.height = '780px';
    say('');
    say('· bảng điểm trên màn hẹp 390px', 'dim');
    setTimeout(function () {
        var dd = win.document;
        var hud = dd.getElementById('hud');
        var stage = dd.querySelector('.stage');
        var hr = hud.getBoundingClientRect(), sr = stage.getBoundingClientRect();
        var bad = [];
        if (hr.right > sr.right + 1) bad.push('bảng điểm tràn ra ngoài mặt tranh ' + Math.round(hr.right - sr.right) + 'px');
        if (hud.scrollWidth > hud.clientWidth + 1)
            bad.push('bảng điểm chật: chữ bên trong rộng ' + hud.scrollWidth + 'px mà chỗ chỉ có ' + hud.clientWidth + 'px');
        if (dd.documentElement.scrollWidth > 391)
            bad.push('cả trang rộng ' + dd.documentElement.scrollWidth + 'px, tràn khỏi màn 390px');
        say('    ' + (bad.length ? bad.join('; ') : 'gọn gàng'),
            bad.length ? 'bad' : 'ok');
        bad.forEach(function (b) { fail('màn 390px: ' + b); });
        finish();
    }, 500);
    }

    function finish() {
        say('');
        if (fails.length) {
            say('KHÔNG ĐẠT:', 'bad');
            fails.forEach(function (f) { say('  · ' + f, 'bad'); });
        } else {
            say('ĐẠT — rô-bốt chơi được bằng chính hàm của ngón tay, không quân nào đè', 'ok');
            say('      lên khối cũ, thả nhanh dừng đúng ô, ăn hàng không sinh ô lơ lửng,', 'ok');
            say('      ân huệ có hạn, ảnh khối đủ và đủ nét, bảng điểm khớp và vừa màn hẹp.', 'ok');
        }
        document.title = fails.length ? 'KHONG DAT ' + fails.length : 'DAT';
        window.__checkDone = { fails: fails };
    }
}
</script>
