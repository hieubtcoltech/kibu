<body class="chrome-fit">
    <header class="unified-nav">
        <div class="nav-left">
            <a href="/" class="nav-home" title="Home" aria-label="Home">
                <img src="/logo.png" alt="KIBU Games">
            </a>
            <div class="brand">
                <img src="/tictactoe-game/icon.png" alt="" class="brand-img"><i class="fa-solid fa-gamepad brand-icon"></i>
                <h1 class="brand-title">TIC TAC TOE</h1>
            </div>
        </div>
        <div class="nav-actions">
        </div>
    </header>

    <div class="game-wrapper">
        <div class="tictactoe-container">
            <!-- Game Setup (Mode & Difficulty) -->
            <div class="setup-section">
                <div class="selector-group">
                    <button id="modePvp" class="selector-btn active" data-i18n="2 BÉ">2 BÉ</button>
                    <button id="modePve" class="selector-btn" data-i18n="ĐÁNH VỚI MÁY">ĐÁNH VỚI MÁY</button>
                </div>
                <div id="difficultyContainer" class="difficulty-group" style="display: none;">
                    <button id="diffEasy" class="difficulty-btn" data-i18n="Dễ">Dễ</button>
                    <button id="diffMedium" class="difficulty-btn active" data-i18n="Vừa">Vừa</button>
                    <button id="diffHard" class="difficulty-btn" data-i18n="Khó">Khó</button>
                </div>
            </div>

            <!-- Turn text indicator -->
            <div id="turnText" class="turn-indicator"></div>

            <!-- Game board -->
            <div id="board" class="tictactoe-board">
                <div class="cell" data-cell="0"></div>
                <div class="cell" data-cell="1"></div>
                <div class="cell" data-cell="2"></div>
                <div class="cell" data-cell="3"></div>
                <div class="cell" data-cell="4"></div>
                <div class="cell" data-cell="5"></div>
                <div class="cell" data-cell="6"></div>
                <div class="cell" data-cell="7"></div>
                <div class="cell" data-cell="8"></div>
            </div>

            <!-- Restart button -->
            <div class="controls-bottom">
                <button id="btnRestart" class="btn-game btn-restart">
                    <i class="fa-solid fa-rotate-right"></i> <span data-i18n="Chơi Lại">Chơi Lại</span>
                </button>
            </div>

            <!-- Game Over Overlay -->
            <div id="gameOverOverlay" class="game-over-overlay">
                <div id="winnerText" class="winner-text"></div>
                <button id="btnRematch" class="btn-game btn-rematch">
                    <i class="fa-solid fa-play"></i> <span data-i18n="Đấu Lại">Đấu Lại</span>
                </button>
                <canvas id="confetti-canvas"></canvas>
            </div>
        </div>
    </div>

    <footer class="site-footer">
        <p class="footer-credit"><i class="fa-solid fa-heart"></i> KIBU Games - 100% Free games built with love for kids and families. <a href="/about">About Us</a></p>
        <div class="footer-tools">
            <span class="online-badge" data-online hidden><span class="online-dot"></span><span data-online-text></span></span>
            <button id="btn-global-lang" class="lang-flag-btn" title="Switch Language / Đổi ngôn ngữ">
                <img id="global-lang-flag" src="https://flagcdn.com/w40/vn.png" alt="Language">
            </button>
        </div>
    </footer>

    <script src="/tictactoe-game/game.js"></script>
</body>
</html>
