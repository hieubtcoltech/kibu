<body class="chrome-fit">
    <!-- Gradient cho quân X và quân O, dùng chung cho mọi hình vẽ trong trang -->
    <svg width="0" height="0" aria-hidden="true" style="position:absolute">
        <defs>
            <linearGradient id="gradX" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#ff9a5c"/>
                <stop offset="100%" stop-color="#ff4f81"/>
            </linearGradient>
            <linearGradient id="gradO" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#3fd0ff"/>
                <stop offset="100%" stop-color="#6a7bff"/>
            </linearGradient>
        </defs>
    </svg>

    <div class="sky-decor" aria-hidden="true">
        <span class="blob blob-1"></span>
        <span class="blob blob-2"></span>
        <span class="blob blob-3"></span>
        <span class="blob blob-4"></span>
    </div>

    <header class="unified-nav">
        <div class="nav-left">
            <a href="/" class="nav-home" title="Home" aria-label="Home">
                <img src="/logo.svg" alt="KIBU Games">
            </a>
            <div class="brand">
                <!-- Icon neon của trang chủ quá tối cho tông pastel này, nên
                     đầu trang dùng dấu hiệu vẽ thẳng bằng SVG -->
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 64 64">
                        <rect x="2" y="2" width="60" height="60" rx="18" fill="#eef4ff" stroke="#dbe4ff" stroke-width="2"/>
                        <g stroke="#c7d6ff" stroke-width="3" stroke-linecap="round">
                            <path d="M23 12 V52"/><path d="M41 12 V52"/>
                            <path d="M12 23 H52"/><path d="M12 41 H52"/>
                        </g>
                        <path d="M14 14 L21 21 M21 14 L14 21" stroke="#ff5f7e" stroke-width="4.5" stroke-linecap="round"/>
                        <circle cx="32" cy="32" r="5" fill="none" stroke="#4aa8ff" stroke-width="4"/>
                        <path d="M43 43 L50 50 M50 43 L43 50" stroke="#ffb444" stroke-width="4.5" stroke-linecap="round"/>
                    </svg>
                </span>
                <h1 class="brand-title">TIC TAC TOE</h1>
            </div>
        </div>
        <div class="nav-actions">
            <button id="btn-sound" class="btn" title="Turn sound on / off">
                <i id="sound-icon" class="fa-solid fa-volume-high"></i> <span>Âm Thanh</span>
            </button>
        </div>
    </header>

    <main class="game-wrapper">
        <section class="play-card">
            <div class="setup">
                <div class="mode-switch" role="group" aria-label="Game mode">
                    <button id="modePvp" class="mode-btn is-active" type="button">2 BÉ</button>
                    <button id="modePve" class="mode-btn" type="button">ĐÁNH VỚI MÁY</button>
                </div>
                <div id="difficultyRow" class="diff-row" role="group" aria-label="Difficulty" hidden>
                    <button class="diff-btn" type="button" data-diff="easy">Dễ</button>
                    <button class="diff-btn is-active" type="button" data-diff="medium">Vừa</button>
                    <button class="diff-btn" type="button" data-diff="hard">Khó</button>
                </div>
            </div>

            <div class="scoreboard">
                <div class="score-chip chip-x">
                    <span class="chip-mark"><svg viewBox="0 0 100 100"><path d="M24 24 L76 76"/><path d="M76 24 L24 76"/></svg></span>
                    <span id="scoreX">0</span>
                </div>
                <div class="score-chip chip-draw">
                    <span class="chip-label">Hoà</span>
                    <span id="scoreDraw">0</span>
                </div>
                <div class="score-chip chip-o">
                    <span class="chip-mark"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="28"/></svg></span>
                    <span id="scoreO">0</span>
                </div>
            </div>

            <!-- game.js tự lo hai ngôn ngữ cho hai ô này, engine khỏi dịch lại -->
            <div id="turnBanner" class="turn-banner" role="status" aria-live="polite" data-i18n-skip></div>

            <div id="board" class="board"></div>

            <button id="btnRestart" class="big-btn btn-restart" type="button">
                <i class="fa-solid fa-rotate-right"></i> <span>Chơi Lại</span>
            </button>

            <div id="overlay" class="result-overlay">
                <canvas id="confetti"></canvas>
                <div class="result-card">
                    <div id="resultMark" class="result-mark"></div>
                    <div id="resultText" class="result-text" data-i18n-skip></div>
                    <button id="btnRematch" class="big-btn btn-play" type="button">
                        <i class="fa-solid fa-play"></i> <span>Đấu Lại</span>
                    </button>
                </div>
            </div>
        </section>
    </main>

            </button>
        </div>
    </footer>
