<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Tic Tac Toe">
    <title>Tic Tac Toe</title>
    <defs>
        <!-- Nền xanh toả tia như mấy ô game khác trên trang chủ, để cả lưới
             icon nhìn cùng một nhà; phần bàn cờ mới là chỗ mang tông trẻ con. -->
        <radialGradient id="bg" cx="50%" cy="46%" r="72%">
            <stop offset="0%" stop-color="#63c8ff"/>
            <stop offset="55%" stop-color="#2f8dff"/>
            <stop offset="100%" stop-color="#1b56d6"/>
        </radialGradient>
        <linearGradient id="x" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ff9a5c"/>
            <stop offset="100%" stop-color="#ff3f78"/>
        </linearGradient>
        <linearGradient id="o" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#3fd0ff"/>
            <stop offset="100%" stop-color="#5f6dff"/>
        </linearGradient>
        <linearGradient id="strike" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ffd24d"/>
            <stop offset="100%" stop-color="#2fd39a"/>
        </linearGradient>
        <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
            <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#5b3f7a" flood-opacity="0.28"/>
        </filter>
    </defs>

    <!-- Nền xanh + tia sáng toả ra từ giữa -->
    <rect width="512" height="512" fill="url(#bg)"/>
    <g fill="#ffffff" opacity="0.10">
        <path d="M256 256 L512 84 L512 214 Z"/>
        <path d="M256 256 L512 330 L512 452 Z"/>
        <path d="M256 256 L300 512 L170 512 Z"/>
        <path d="M256 256 L0 430 L0 300 Z"/>
        <path d="M256 256 L0 182 L0 60 Z"/>
        <path d="M256 256 L212 0 L342 0 Z"/>
    </g>
    <g fill="#ffffff" opacity="0.16">
        <circle cx="66" cy="80" r="46"/>
        <circle cx="456" cy="150" r="30"/>
        <circle cx="112" cy="456" r="26"/>
    </g>

    <!-- Bàn cờ trắng, nghiêng nhẹ cho vui mắt.
         Ô cờ rộng 113: tâm ba cột nằm ở 142, 256 và 370. -->
    <g transform="rotate(-6 256 256)" filter="url(#soft)">
        <rect x="80" y="80" width="352" height="352" rx="58" fill="#ffffff" stroke="#ffffff" stroke-width="14"/>
        <g stroke="#d3e0ff" stroke-width="12" stroke-linecap="round">
            <path d="M206 116 V396"/>
            <path d="M306 116 V396"/>
            <path d="M116 206 H396"/>
            <path d="M116 306 H396"/>
        </g>

        <!-- Vạch nối nằm dưới quân cờ, đúng như trong game -->
        <path d="M156 156 L356 356" stroke="url(#strike)" stroke-width="16" stroke-linecap="round"/>

        <!-- Đường chéo thắng của quân X -->
        <g stroke="url(#x)" stroke-width="22" stroke-linecap="round" fill="none">
            <path d="M134 134 L178 178 M178 134 L134 178"/>
            <path d="M234 234 L278 278 M278 234 L234 278"/>
            <path d="M334 334 L378 378 M378 334 L334 378"/>
        </g>

        <!-- Hai quân O của bé kia -->
        <g stroke="url(#o)" stroke-width="20" fill="none">
            <circle cx="356" cy="156" r="26"/>
            <circle cx="156" cy="356" r="26"/>
        </g>
    </g>

    <!-- Pháo giấy -->
    <g opacity="0.95">
        <rect x="426" y="330" width="26" height="34" rx="7" fill="#2fd39a" transform="rotate(24 439 347)"/>
        <rect x="52" y="252" width="22" height="30" rx="6" fill="#ffd24d" transform="rotate(-18 63 267)"/>
        <rect x="404" y="62" width="20" height="28" rx="6" fill="#ffffff" opacity="0.85" transform="rotate(35 414 76)"/>
        <circle cx="70" cy="180" r="11" fill="#ffffff" opacity="0.9"/>
        <circle cx="330" cy="470" r="13" fill="#ffffff" opacity="0.75"/>
    </g>
</svg>
